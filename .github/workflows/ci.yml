name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Icon Composer `.icon` assets require Xcode 26 or newer.
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Install mise tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies and generate workspace
        run: |
          mise x -- tuist install
          mise x -- tuist generate --no-open

      - name: Validate source privacy manifest
        run: |
          plutil -lint dexo/PrivacyInfo.xcprivacy
          plutil -convert json -o /tmp/privacy.json dexo/PrivacyInfo.xcprivacy
          jq -e '
            .NSPrivacyTracking == false and
            any(.NSPrivacyAccessedAPITypes[];
              .NSPrivacyAccessedAPIType == "NSPrivacyAccessedAPICategoryUserDefaults" and
              (.NSPrivacyAccessedAPITypeReasons | index("CA92.1") != null)
            ) and
            any(.NSPrivacyAccessedAPITypes[];
              .NSPrivacyAccessedAPIType == "NSPrivacyAccessedAPICategorySystemBootTime" and
              (.NSPrivacyAccessedAPITypeReasons | index("35F9.1") != null)
            )
          ' /tmp/privacy.json

      - name: Test CookedHTML
        working-directory: Packages/CookedHTML
        run: swift test

      - name: Run app unit tests
        run: |
          xcodebuild test \
            -workspace dexo.xcworkspace \
            -scheme dexo \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=26.2' \
            -derivedDataPath build/DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Build app without signing
        run: |
          xcodebuild build \
            -workspace dexo.xcworkspace \
            -scheme dexo \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -quiet \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=''

      - name: Validate bundled privacy manifest
        run: |
          manifest=build/DerivedData/Build/Products/Debug-iphoneos/dexo.app/PrivacyInfo.xcprivacy
          info_plist=build/DerivedData/Build/Products/Debug-iphoneos/dexo.app/Info.plist
          test -f "$manifest"
          plutil -lint "$manifest"
          cmp dexo/PrivacyInfo.xcprivacy "$manifest"
          if arbitrary_loads=$(plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads raw "$info_plist" 2>/dev/null); then
            test "$arbitrary_loads" != "true"
          fi
