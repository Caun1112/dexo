name: Build Unsigned IPA (Artifact)

# Manual-only build that uploads the unsigned IPA as a workflow artifact
# instead of publishing a tag/Release. Use this to test a feature branch.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Generate Xcode project
        run: mise x -- tuist install && mise x -- tuist generate

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -workspace dexo.xcworkspace \
            -scheme dexo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/dexo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/dexo.xcarchive/Products/Applications/dexo.app build/Payload/
          cd build && zip -r dexo-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: dexo-unsigned-ipa
          path: build/dexo-unsigned.ipa
          if-no-files-found: error
